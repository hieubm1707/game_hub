name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js-ts-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:contract && pnpm test:cli && pnpm test:hub

  flutter-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: packages/game_platform
        run: flutter pub get && flutter test
      - working-directory: fixtures/games/iq_puzzle_fixture
        run: flutter pub get && flutter test
      - working-directory: fixtures/games/memory_match_fixture
        run: flutter pub get && flutter test
